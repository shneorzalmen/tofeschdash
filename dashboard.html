<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח בקרה – מיפוי מוסדות | לב חב"ד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--m:#6b1126;--md:#4a0c1d;--o:#f08a2a;--bg:#f8f4f1;--line:#e6d9d3;--mut:#6f6068}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--md);font-family:'Heebo',Arial,sans-serif;font-size:16px}
button,select,input{font:inherit}[hidden]{display:none!important}
header{background:#fff;border-bottom:5px solid var(--o);display:flex;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
header img{height:60px}header h1{margin:0;font-size:21px;color:var(--m);flex:1;min-width:200px}header small{color:var(--mut)}
.btn{background:var(--m);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}.btn.g{background:#fff;color:var(--m);border:1.5px solid var(--m)}
#login{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);border-top:5px solid var(--o);border-radius:14px;padding:28px;text-align:center}
#login input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;margin:14px 0}#err{color:#c0392b;min-height:22px;margin-bottom:8px}
#app{display:none;max-width:1280px;margin:0 auto;padding:14px 14px 50px}
#tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}#tabs button{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 22px;cursor:pointer;font-weight:500;color:var(--md)}#tabs button.on{background:var(--m);border-color:var(--m);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--m)}.k[data-pr]{cursor:pointer;border-top-color:var(--o)}.k[data-pr]:hover{background:#fff6ec}
.k b{display:block;font-size:32px;line-height:1.1}.k span{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.p,.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.p h2,.box h2{margin:0 0 10px;font-size:17px}
.bar,.lg{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;font-size:14px}.bar:hover .nm,.lg:hover{text-decoration:underline}
.bar .nm{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .tr{flex:1;background:#f3e9e4;border-radius:5px;height:16px}.bar .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--m),var(--o))}.bar b{width:26px;text-align:left}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.tlc{display:flex;gap:6px;align-items:flex-end;height:170px}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.col i{width:100%;background:linear-gradient(var(--o),var(--m));border-radius:4px 4px 0 0;min-height:3px}.col span{font-size:11px;color:var(--mut)}.col b{font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input,.tools select{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:#fafafa}.tools input{flex:1;min-width:200px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.pill{border:1.5px solid var(--o);color:var(--m);background:#fff;border-radius:99px;padding:3px 13px;cursor:pointer;font-size:14px}.pill.on{background:var(--o);color:#fff}
.chip{background:var(--m);color:#fff;border-radius:99px;padding:3px 12px;font-size:14px;cursor:pointer}
.tw{overflow-x:auto;max-height:640px;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--m);color:#fff;padding:9px 10px;text-align:right;white-space:nowrap}td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}tr.r:nth-child(even){background:#fdf6ef}tr.r:hover{background:#fbe6d0}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;background:#f3e9e4;margin:1px}.tag.y{background:#e3f3e3;color:#1c5d1c}.tag.n{background:#fbe3e0;color:#8a2a1c}
.ov{position:fixed;inset:0;background:#0007;z-index:20;overflow:auto;padding:20px 10px}.mc{background:#fff;max-width:760px;margin:0 auto;border-radius:14px;border-top:6px solid var(--o);padding:22px}
.mc h2{margin:0;font-size:24px;color:var(--m)}.mc .sub{color:var(--mut);margin-bottom:12px}.mc h3{margin:18px 0 6px;font-size:15px;color:var(--m);border-bottom:2px solid #f3e9e4;padding-bottom:3px}
.f{display:flex;gap:10px;padding:3px 0;font-size:15px}.f b{width:150px;flex:none;color:var(--mut);font-weight:500}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
@media(max-width:600px){.f{flex-direction:column;gap:0}.f b{width:auto}}
</style></head><body>
<header><img src="logo.png" alt="לב חב&quot;ד"><h1>לוח בקרה – מיפוי מוסדות גריאטריים</h1><small id="upd"></small><button class="btn g" id="rf" hidden>רענון</button><button class="btn g" id="out" hidden>יציאה</button></header>
<div id="login"><h2>כניסה לצוות</h2><input type="password" id="pw" placeholder="סיסמה"><div id="err"></div><button class="btn" id="go">כניסה</button></div>
<div id="app">
 <div id="tabs"><button data-t="o" class="on">סקירה</button><button data-t="i">מוסדות</button><button data-t="s">שליחים וערים</button></div>
 <div id="t-o"><div class="kpis" id="kpis"></div><div class="grid" id="panels"></div></div>
 <div id="t-i" hidden><div class="box"><div class="tools"><input id="q" placeholder="חיפוש חופשי: מוסד, שליח, עיר, טלפון…"><select id="fc"></select><select id="fs"></select><select id="fa"></select><button class="btn" id="csv">הורדה לאקסל</button></div>
  <div class="pills" id="pills"></div><div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></div></div>
 <div id="t-s" hidden><div class="grid" id="sc" style="grid-template-columns:repeat(auto-fit,minmax(420px,1fr))"></div></div>
</div>
<div class="ov" id="md" hidden><div class="mc" id="mc"></div></div>
<script>
const U='https://script.google.com/macros/s/AKfycbwXCYpD1QPOBSctWX3I6fMV3FjEQ6gmODve54WipOhRicZBFKRBuin0v4ybhmEy_Tzu/exec';
const K={c:'עיר / אזור השליחות',s:'שם מלא',a:'פעילות חב"ד כיום',e:'העסקה ישירה',m:'קשר עם הנהלה',t:'סוג המוסד',z:'גודל המוסד',n:'שם המוסד',p:'טלפון נייד',d:'תאריך ושעה',x:'פעילויות קיימות',nd:'צרכים',r:'רב המוסד'};
const MULTI=new Set([K.t,K.x,K.nd]),COL=['#6b1126','#f08a2a','#c9a24a','#a5566b','#d9b99b','#8c8c8c'];
const PRE={'עם פעילות חב"ד':r=>/^כן/.test(r[K.a]),'ללא פעילות':r=>/^לא מתקיימת/.test(r[K.a]),'פוטנציאל העסקה':r=>/^כן/.test(r[K.e]),'ללא קשר עם הנהלה':r=>/^לא קיים/.test(r[K.m])};
const SEC=[['השליח והאזור',[K.s,K.p,'דואר אלקטרוני',K.c,'מעמד הפעילות באזור']],['המוסד',[K.t,K.z]],['הנהלה ושירותי דת',[K.m,K.r,'שם רב המוסד / איש קשר','מטבח וכשרות','דרישה למשגיח / רב',K.e]],['הפעילות',[K.a,'מי מבצע',K.x]],['צרכים והערות',[K.nd,'הערות']]];
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows=[],L=[],F={q:'',f:{},p:null},pw='';
const vals=(r,k)=>{const v=(r[k]||'').trim();let a=MULTI.has(k)?v.split('|').map(x=>x.trim()).filter(Boolean):(v?[v]:[]);a=a.map(x=>x.startsWith('אחר:')?'אחר':x);return a.length?a:['לא צוין']};
const cnt=k=>{const m={};rows.forEach(r=>vals(r,k).forEach(v=>m[v]=(m[v]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const dk=(k,v)=>`data-k="${esc(k)}" data-v="${esc(v)}"`;
async function load(p,quiet){
  $('err').textContent='';
  try{const d=await(await fetch(U+'?key='+encodeURIComponent(p))).json();
    if(d.error){$('err').textContent='סיסמה שגויה';sessionStorage.removeItem('pw');return}
    pw=p;rows=d.rows.reverse();sessionStorage.setItem('pw',p);
    $('login').style.display='none';$('app').style.display='block';$('rf').hidden=$('out').hidden=false;
    $('upd').textContent='עודכן '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});render();
  }catch(e){if(!quiet)$('err').textContent='לא הצלחנו להתחבר לנתונים. נסה שוב.'}
}
function bars(t,k,n){const c=cnt(k).slice(0,n||10),mx=c[0]?c[0][1]:1;return `<div class="p"><h2>${t}</h2>`+c.map(([v,x])=>`<div class="bar" ${dk(k,v)}><span class="nm" title="${esc(v)}">${esc(v)}</span><span class="tr"><i style="width:${100*x/mx}%"></i></span><b>${x}</b></div>`).join('')+'</div>'}
function donut(k,t){const c=cnt(k),T=rows.length||1,Lc=2*Math.PI*40;let off=0;
  const sg=c.map(([v,x],i)=>{const l=Lc*x/T,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${COL[i%6]}" stroke-width="18" stroke-dasharray="${l} ${Lc-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return s}).join('');
  return `<div class="p"><h2>${t}</h2><div class="dn"><svg viewBox="0 0 100 100" width="150" height="150">${sg}<text x="50" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="#4a0c1d">${rows.length}</text></svg><div>`+c.map(([v,x],i)=>`<div class="lg" ${dk(k,v)}><i style="background:${COL[i%6]}"></i>${esc(v)} <b>${x}</b></div>`).join('')+'</div></div></div>'}
function timeline(){const m={};rows.forEach(r=>{const t=/(\d+)\.(\d+)\.(\d+)/.exec(r[K.d]||'');if(t){const k=t[3]+'-'+('0'+t[2]).slice(-2)+'-'+('0'+t[1]).slice(-2);m[k]=(m[k]||0)+1}});
  const e=Object.entries(m).sort().slice(-14),mx=Math.max(1,...e.map(x=>x[1]));
  return '<div class="p"><h2>דיווחים לפי יום</h2><div class="tlc">'+(e.map(([d,x])=>`<div class="col"><b>${x}</b><i style="height:calc((100% - 34px)*${x/mx})"></i><span>${d.slice(8)}.${d.slice(5,7)}</span></div>`).join('')||'אין נתונים')+'</div></div>'}
function render(){
  const n=f=>rows.filter(f).length,sh=new Set(rows.map(r=>r[K.p]||r[K.s])).size,ci=new Set(rows.map(r=>(r[K.c]||'').trim())).size;
  const kp=[[rows.length,'מוסדות שמופו'],[sh,'שליחים שדיווחו'],[ci,'ערים / אזורים'],[n(PRE['עם פעילות חב"ד']),'עם פעילות חב"ד','עם פעילות חב"ד'],[n(PRE['ללא פעילות']),'ללא פעילות כרגע','ללא פעילות'],[n(PRE['פוטנציאל העסקה']),'פוטנציאל להעסקה','פוטנציאל העסקה']];
  $('kpis').innerHTML=kp.map(([v,l,p])=>`<div class="k"${p?` data-pr="${esc(p)}"`:''}><b>${v}</b><span>${l}</span></div>`).join('');
  $('panels').innerHTML=donut(K.a,'פעילות חב"ד כיום')+timeline()+bars('עיר / אזור',K.c)+bars('שליח',K.s)+bars('הפעילויות שמתקיימות',K.x,14)+bars('הצרכים שעלו',K.nd)+bars('גודל המוסד',K.z)+bars('קשר עם הנהלה',K.m)+bars('אפשרות להעסקה ישירה',K.e)+bars('רב המוסד',K.r);
  const opt=(k,t)=>`<option value="">${t}</option>`+cnt(k).map(([v])=>`<option>${esc(v)}</option>`).join('');
  $('fc').innerHTML=opt(K.c,'כל הערים');$('fs').innerHTML=opt(K.s,'כל השליחים');$('fa').innerHTML=opt(K.a,'כל מצבי הפעילות');
  $('th').innerHTML='<tr>'+['שם המוסד','עיר / אזור','שליח','סוג','גודל','פעילות כיום','קשר עם הנהלה'].map(c=>`<th>${c}</th>`).join('')+'</tr>';
  groups();table();
}
const pillT=v=>v?`<span class="tag ${/^כן/.test(v)?'y':/^לא מתקיימת|^לא קיים/.test(v)?'n':''}">${esc(v)}</span>`:'';
function table(){
  const q=F.q.trim();
  L=rows.filter(r=>Object.entries(F.f).every(([k,v])=>vals(r,k).includes(v))&&(!F.p||PRE[F.p](r))&&(!q||Object.values(r).join(' ').includes(q)));
  $('fc').value=F.f[K.c]||'';$('fs').value=F.f[K.s]||'';$('fa').value=F.f[K.a]||'';
  $('pills').innerHTML=Object.keys(PRE).map(p=>`<span class="pill${F.p===p?' on':''}" data-pr="${esc(p)}">${esc(p)}</span>`).join('')
    +Object.entries(F.f).map(([k,v])=>`<span class="chip" data-x="${esc(k)}" title="${esc(k)}">${esc(v)} ✕</span>`).join('')+`<span class="cnt" style="color:var(--mut);font-size:14px">${L.length} מתוך ${rows.length}</span>`;
  $('tb').innerHTML=L.map((r,i)=>`<tr class="r" data-i="${i}"><td><b>${esc(r[K.n])}</b></td><td>${esc(r[K.c])}</td><td>${esc(r[K.s])}</td><td>${vals(r,K.t).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</td><td>${esc(r[K.z])}</td><td>${pillT(r[K.a])}</td><td>${esc(r[K.m])}</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px">אין תוצאות</td></tr>';
}
function groups(){
  const S={},C={},act=r=>/^כן/.test(r[K.a])?1:0;
  rows.forEach(r=>{const a=r[K.s]+'|'+r[K.p],c=(r[K.c]||'').trim()||'לא צוין';
    const s=S[a]=S[a]||{s:r[K.s],p:r[K.p],c:new Set(),n:0,a:0};s.c.add(c);s.n++;s.a+=act(r);
    const g=C[c]=C[c]||{c,h:new Set(),n:0,a:0};g.h.add(a);g.n++;g.a+=act(r)});
  const tb=(t,h,b)=>`<div class="box"><h2>${t}</h2><div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table></div></div>`;
  $('sc').innerHTML=tb('שליחים',['שליח','טלפון','אזור','מוסדות','עם פעילות'],Object.values(S).sort((a,b)=>b.n-a.n).map(s=>`<tr class="r" ${dk(K.s,s.s)}><td><b>${esc(s.s)}</b></td><td>${esc(s.p)}</td><td>${esc([...s.c].join(', '))}</td><td>${s.n}</td><td>${s.a}</td></tr>`).join(''))
   +tb('ערים / אזורים',['עיר / אזור','מוסדות','שליחים','עם פעילות'],Object.values(C).sort((a,b)=>b.n-a.n).map(g=>`<tr class="r" ${dk(K.c,g.c)}><td><b>${esc(g.c)}</b></td><td>${g.n}</td><td>${g.h.size}</td><td>${g.a}</td></tr>`).join(''));
}
function go(t){['o','i','s'].forEach(x=>{$('t-'+x).hidden=x!==t});document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));scrollTo(0,0)}
function modal(r){
  const ph=(r[K.p]||'').replace(/\D/g,''),wa=ph.startsWith('0')?'972'+ph.slice(1):ph,em=r['דואר אלקטרוני'];
  $('mc').innerHTML=`<button class="btn g" style="float:left" id="cl">סגירה ✕</button><h2>${esc(r[K.n])}</h2><div class="sub">${esc(r[K.c])} · דווח על ידי ${esc(r[K.s])} · ${esc(r[K.d])}</div>
  <div class="acts">${ph?`<a class="btn" href="tel:${esc(r[K.p])}">📞 התקשר</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa}">וואטסאפ</a>`:''}${em?`<a class="btn g" href="mailto:${esc(em)}">✉ מייל</a>`:''}</div>`
  +SEC.map(([t,ks])=>{const b=ks.filter(k=>r[k]).map(k=>`<div class="f"><b>${esc(k)}</b><span>${MULTI.has(k)?r[k].split('|').map(x=>`<span class="tag">${esc(x.trim())}</span>`).join(''):(k===K.a||k===K.e||k===K.m?pillT(r[k]):esc(r[k]))}</span></div>`).join('');return b?`<h3>${t}</h3>${b}`:''}).join('');
  $('md').hidden=false;$('cl').onclick=()=>{$('md').hidden=true};
}
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(t===$('md')){$('md').hidden=true;return}
  if(el=t.closest('#tabs button')){go(el.dataset.t);return}
  if(el=t.closest('[data-pr]')){F.p=F.p===el.dataset.pr&&el.closest('#pills')?null:el.dataset.pr;go('i');table();return}
  if(el=t.closest('[data-x]')){delete F.f[el.dataset.x];table();return}
  if(el=t.closest('[data-k]')){F.f[el.dataset.k]=el.dataset.v;go('i');table();return}
  if((el=t.closest('tr.r'))&&el.dataset.i!=null)modal(L[el.dataset.i]);
});
addEventListener('keydown',e=>{if(e.key==='Escape')$('md').hidden=true});
$('q').oninput=e=>{F.q=e.target.value;table()};
[['fc',K.c],['fs',K.s],['fa',K.a]].forEach(([id,k])=>$(id).onchange=e=>{e.target.value?F.f[k]=e.target.value:delete F.f[k];table()});
$('csv').onclick=()=>{const k=rows[0]?Object.keys(rows[0]).filter(x=>x!=='מס׳'):[],q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+k.map(q).join(',')+'\n'+L.map(r=>k.map(c=>q(r[c])).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='מיפוי-מוסדות.csv';a.click()};
$('go').onclick=()=>load($('pw').value);$('pw').onkeydown=e=>{if(e.key==='Enter')load($('pw').value)};
$('rf').onclick=()=>load(pw);$('out').onclick=()=>{sessionStorage.removeItem('pw');location.reload()};
setInterval(()=>{if(pw&&!document.hidden)load(pw,true)},120000);
const sp=sessionStorage.getItem('pw');if(sp)load(sp);
</script></body></html>
